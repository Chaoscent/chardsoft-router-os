# Jellyfin. Media goes into ${CHARDSOFT_DATA}/media on the router.
services:
  jellyfin:
    image: jellyfin/jellyfin:latest
    restart: unless-stopped
    ports:
      - "127.0.0.1:${CHARDSOFT_PORT}:8096"
    volumes:
      - "${CHARDSOFT_DATA}/config:/config"
      - "${CHARDSOFT_DATA}/cache:/cache"
      - "${CHARDSOFT_DATA}/media:/media"
    environment:
      TZ: "${TZ}"
      JELLYFIN_PublishedServerUrl: "https://${CHARDSOFT_HOST}"
