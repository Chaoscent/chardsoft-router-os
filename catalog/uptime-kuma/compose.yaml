# Uptime Kuma. Variables come from app.env (chardsoft-apps writes it).
services:
  uptime-kuma:
    image: louislam/uptime-kuma:1
    restart: unless-stopped
    ports:
      - "127.0.0.1:${CHARDSOFT_PORT}:3001"
    volumes:
      - "${CHARDSOFT_DATA}/data:/app/data"
    environment:
      TZ: "${TZ}"
