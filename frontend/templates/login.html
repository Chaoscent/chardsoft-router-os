<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="csrf-token" content="{{ csrf_token() }}">
<title>Chardsoft Router OS</title>
    <!-- The light/dark choice from the header switch, before the first paint. -->
    <script>try{var t=localStorage.getItem("chardsoft-theme");if(t==="light"||t==="dark")document.documentElement.dataset.theme=t}catch(e){}</script>

<link rel="icon" sizes="16x16 32x32 48x48" href="{{ asset('favicon.ico') }}">
<link rel="icon" type="image/png" sizes="32x32" href="{{ asset('favicon-32.png') }}">
<link rel="apple-touch-icon" href="{{ asset('apple-touch-icon.png') }}">

<link rel="stylesheet" href="{{ asset('chardsoft/chardsoft.css') }}">

<link rel="stylesheet" href="{{ asset('css/theme.css') }}">
<link rel="stylesheet" href="{{ asset('css/style.css') }}">
</head>

<body class="login-body">

<form class="login-card" onsubmit="event.preventDefault(); login();">

    <h1>Chardsoft Router OS</h1>
    <p>Sign in to manage your router.</p>

    <div class="setup-field">
        <label for="username">User name</label>
        <input id="username" class="setting-input" value="admin" autocomplete="username">
    </div>

    <div class="setup-field">
        <label for="password">Password</label>
        <input id="password" class="setting-input" type="password" autocomplete="current-password" autofocus>
    </div>

    <div id="codeField" class="setup-field hidden">
        <label for="code">Code from your authenticator app</label>
        <input id="code" class="setting-input" inputmode="numeric" autocomplete="one-time-code" maxlength="12" placeholder="123456 or a recovery code">
    </div>
    <div id="error" class="setup-error hidden" role="alert">Invalid username or password.</div>

    <div class="setup-actions">
        <button id="loginButton" type="submit" class="save-btn">Sign in</button>
    </div>

</form>

<script src="{{ asset('js/csrf.js') }}"></script>

<script>
async function login(){

    if(loginButton.disabled) return;

    loginButton.disabled = true;
    loginButton.classList.add("busy");
    loginButton.textContent = "Signing in …";
    error.classList.add("hidden");

    let res = null;

    try{
        res = await fetch("/api/login",{
            method:"POST",
            headers:{
                "Content-Type":"application/json"
            },
            body:JSON.stringify({
                username:username.value,
                password:password.value,
                code:code.value
            })
        });
    }catch(e){
        res = null;
    }

    let data = null;

    if(res){
        try{
            data = await res.json();
        }catch{
            data = null;
        }
    }

    if(res && res.ok && data && data.success){
        location.href="/";
        return;
    }

    const message = !res ? "Could not reach the router."
        : (data && data.message) || "Invalid username or password.";

    loginButton.disabled = false;
    loginButton.classList.remove("busy");
    loginButton.textContent = "Sign in";

    // Password right, two-step login on: the code comes next.
    if(data && data.need_code){

        const first = codeField.classList.contains("hidden");

        codeField.classList.remove("hidden");
        username.readOnly = true;
        password.readOnly = true;
        code.value = "";
        code.focus();

        if(first) return;
    }

    error.textContent = message;

    error.classList.remove("hidden");

    loginButton.disabled = false;
    loginButton.classList.remove("busy");
    loginButton.textContent = "Sign in";
}

</script>

</body>
</html>
